worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include      mime.types;
    default_type application/octet-stream;
    sendfile     on;
    keepalive_timeout 65;

    # ── Upstreams pointing to Docker Containers ──
    upstream waf_api {
        server api:5000;
    }

    upstream dashboard_app {
        server dashboard:8070;
    }

    server {
        listen       8060;
        server_name  localhost;

        # Shared Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ── 1. Static Files & Favicon (Bypass WAF) ──
        location /static/ {
            proxy_pass http://waf_api/static/;
            auth_request off;
        }

        location = /favicon.ico {
            empty_gif;
            access_log off;
            log_not_found off;
            auth_request off;
        }

        # ── 2. Dashboard Pages & Auth Routes (Bypass WAF) ──
        location ~ ^/(dashboard|login|signup|forgot-password|privacy|terms|docs|support)$ {
            proxy_pass http://dashboard_app;
            auth_request off;
        }

        location /auth/ {
            proxy_pass http://waf_api/auth/;
            auth_request off;
        }

        # ── 3. Dashboard API Routes (Bypass WAF Auth) ──
        location ~ ^/api/(dashboard|system|incidents|incident|ml|user|reports|blocked-events|subscription|request-reset-otp|verify-reset-otp)/? {
            proxy_pass http://dashboard_app;
            auth_request off;
        }

        # ── 4. WAF API Management Routes (Protected by WAF) ──
        location /api/ {
            auth_request /waf-inspect;
            proxy_pass http://waf_api;
        }

        location = /health {
            proxy_pass http://waf_api/health;
            auth_request off;
        }

        # ── 5. WAF Authorization Subrequest ──
        location = /waf-inspect {
            internal;
            proxy_pass http://waf_api/waf-inspect;
            
            proxy_pass_request_body on;
            proxy_set_header Content-Length $content_length;
            
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Original-Method $request_method;

            # Pass Headers to WAF for ML and CSRF
            proxy_set_header User-Agent $http_user_agent;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Accept $http_accept;
            proxy_set_header Accept-Language $http_accept_language;
        }

        # Custom error page for blocked requests
        error_page 400 401 403 = @waf_blocked;
        location @waf_blocked {
            default_type application/json;
            return 403 '{"error": "Malicious request blocked by WAF."}';
        }

        # Custom error page if Dashboard/WAF goes down
        error_page 502 = @gateway_down;
        location @gateway_down {
            default_type application/json;
            return 502 '{"error": "Upstream server is down or unreachable. Please check Python services."}';
        }

        # ── 6. External Traffic Proxy (STRICTLY Protected by WAF) ──
        location / {
            # 1. WAF Inspection
            auth_request /waf-inspect;

            # 2. Redirect to upstream test target
            proxy_pass https://httpbin.org;

            proxy_ssl_server_name on;
            proxy_set_header Host httpbin.org;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
