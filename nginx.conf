worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       8080;
        server_name  localhost;

        # Local Flask Management & API Routes - Bypass WAF Auth
        location /api/ {
            proxy_pass http://127.0.0.1:5000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /dashboard/ {
            proxy_pass http://127.0.0.1:5000/dashboard/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        location /auth/ {
            proxy_pass http://127.0.0.1:5000/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        location /static/ {
            proxy_pass http://127.0.0.1:5000/static/;
            proxy_set_header Host $host;
        }

        location /health {
            proxy_pass http://127.0.0.1:5000/health;
            proxy_set_header Host $host;
        }

        # ── External Traffic Proxy (Protected by WAF) ──
        location / {
            # 1. Forward the request to Flask WAF for inspection
            auth_request /waf-inspect;

            # 2. If WAF returns 200 OK, forward to the target
            proxy_pass https://fakestoreapi.com;
            
            # Target requirements for HTTPS proxying
            proxy_ssl_server_name on;
            proxy_set_header Host fakestoreapi.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── WAF Authorization Subrequest ──
        location = /waf-inspect {
            internal;
            
            # Proxy to the Flask /waf-inspect endpoint
            proxy_pass http://127.0.0.1:5000/waf-inspect;
            
            # Crucial: forward the original body and headers for 7-layer inspection
            proxy_pass_request_body on;
            proxy_set_header Content-Length $content_length;
            
            # Forward original URI and Method so Flask knows what the actual request was
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Original-Method $request_method;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Custom error page for blocked requests
        error_page 400 401 403 = @waf_blocked;
        location @waf_blocked {
            default_type application/json;
            return 403 '{"error": "Malicious request blocked by WAF."}';
        }
    }
}
