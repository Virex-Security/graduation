version: '3.9'

services:

  # ── 1. Database Service (PostgreSQL) ──
  # db:
  #   image: postgres:15-alpine
  #   container_name: virex-db
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_DB: virex
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: postgres
  #     PGDATA: /var/lib/postgresql/data/pgdata
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #     - ./db_init/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U postgres -d virex"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  # ── 2. WAF API Service (Flask Security Engine) ──
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: virex-api
    restart: unless-stopped
    # depends_on:
    #   db:
    #     condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      - API_PORT=5000
      - DATABASE_URL=postgresql://postgres.hbgnqfhaatmvqgepzlbi:HMMRMY%402026@aws-1-eu-central-1.pooler.supabase.com:6543/postgres
      - SECRET_KEY=1048759823e437a5439f5ba00fd4b8747e788a7b3c91805b230c6088e0078b2a
      - INTERNAL_API_SECRET=supersecrettoken
      - FLASK_ENV=production
      - FLASK_DEBUG=0
      - COOKIE_SECURE=false
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:8070,http://localhost:8060
      - DASHBOARD_URL=http://dashboard:8070
      - TARGET_EXTERNAL_SITE=https://fakestoreapi.com
      - SMTP_EMAIL=smartwebdef@gmail.com
      - SMTP_PASSWORD=ptga crhz gocf cxsg
      - ML_THRESHOLD_BLOCK=0.90
      - ML_THRESHOLD_MONITOR=0.70
      - MAX_CONTENT_LENGTH=1048576
    volumes:
      - virex-data:/app/data
      - virex-logs:/app/logs
    command: gunicorn --bind 0.0.0.0:5000 --workers 2 --threads 10 --worker-class gthread --timeout 90 run_api:app
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\""]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── 3. Dashboard Service (Flask SIEM Server) ──
  dashboard:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: virex-dashboard
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8090:8070"  # Exposed internally as 8070, mapped to host 8090
    environment:
      - DASHBOARD_PORT=8070
      - DATABASE_URL=postgresql://postgres.hbgnqfhaatmvqgepzlbi:HMMRMY%402026@aws-1-eu-central-1.pooler.supabase.com:6543/postgres
      - SECRET_KEY=1048759823e437a5439f5ba00fd4b8747e788a7b3c91805b230c6088e0078b2a
      - INTERNAL_API_SECRET=supersecrettoken
      - FLASK_ENV=production
      - FLASK_DEBUG=0
      - COOKIE_SECURE=false
      - DASHBOARD_URL=http://dashboard:8070
      - API_URL=http://api:5000
      - SMTP_EMAIL=smartwebdef@gmail.com
      - SMTP_PASSWORD=ptga crhz gocf cxsg
    volumes:
      - virex-data:/app/data
      - virex-logs:/app/logs
    command: gunicorn --bind 0.0.0.0:8070 --workers 2 --threads 10 --worker-class gthread --timeout 90 run_dashboard:app
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8070/api/health')\""]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── 4. React Frontend Service (Port 8070) ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: virex-frontend
    restart: unless-stopped
    depends_on:
      - nginx
    ports:
      - "8070:8070"  # React app runs on port 8070 on the host machine
    environment:
      - VITE_DEV_PORT=8070
      - VITE_API_TARGET=http://nginx:8060  # Proxies API requests to the Nginx gateway
    volumes:
      - ./frontend:/app
      - /app/node_modules

  # ── 5. Nginx Reverse Proxy Gateway (Port 8060) ──
  nginx:
    image: nginx:1.25-alpine
    container_name: virex-nginx
    restart: unless-stopped
    depends_on:
      - api
      - dashboard
    ports:
      - "8060:8060"  # Gateway runs on port 8060 on the host machine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

# ── Persistent Volumes ──
volumes:
  # postgres_data:
  #   name: virex-postgres-data
  virex-data:
    name: virex-appdata
  virex-logs:
    name: virex-applogs
