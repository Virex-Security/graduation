<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virex - Attack Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 p-4 md:p-8 font-sans">

    <div class="max-w-4xl mx-auto">
        <div class="border-b border-red-500/30 pb-4 mb-8">
            <h1 class="text-2xl md:text-3xl font-bold tracking-wider text-red-500 style-neon">
                ⚔️ VIREX - ATTACK SIMULATOR (MALICIOUS INJECTOR)
            </h1>
            <p class="text-slate-400 text-sm mt-1">Target Gateway: <span class="text-cyan-400 font-mono">http://localhost:5000/products</span> (Reverse Proxy WAF)</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-2xl">
                <h2 class="text-xl font-semibold text-cyan-400 mb-4 border-b border-slate-800 pb-2">Configuration</h2>
                
                <div class="mb-4">
                    <label class="block text-slate-400 text-sm font-medium mb-2">Select Vector Type:</label>
                    <select id="attackType" onchange="updatePayloadTemplate()" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-slate-200 focus:outline-none focus:border-cyan-500 cursor-pointer">
                        <option value="normal">🟢 Normal Request (Clean Traffic)</option>
                        <option value="sqli">🛑 SQL Injection (UNION Attack)</option>
                        <option value="xss">🛑 Cross-Site Scripting (XSS Tag)</option>
                    </select>
                </div>

                <div class="mb-6">
                    <label class="block text-slate-400 text-sm font-medium mb-2">HTTP Request JSON Body:</label>
                    <textarea id="jsonPayload" rows="8" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-4 text-emerald-400 font-mono text-sm focus:outline-none focus:border-cyan-500 resize-none"></textarea>
                </div>

                <button id="launchBtn" onclick="launchPayload()" class="w-full font-bold uppercase tracking-wider py-3 rounded-lg text-white transition-all duration-200 bg-emerald-600 hover:bg-emerald-500 shadow-[0_0_15px_rgba(16,185,129,0.3)]">
                    🚀 Launch Payload
                </button>
            </div>

            <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-2xl flex flex-col">
                <h2 class="text-xl font-semibold text-cyan-400 mb-4 border-b border-slate-800 pb-2">Intercepted Wire Response</h2>
                
                <div class="mb-4">
                    <span class="text-slate-400 text-sm block mb-1">HTTP Status Code:</span>
                    <div id="statusBadge" class="text-slate-600 italic text-sm">Awaiting Payload Execution...</div>
                </div>

                <div class="flex-1 bg-slate-950 border border-slate-800 rounded-lg p-4 font-mono text-xs overflow-auto max-h-[320px] min-h-[200px]">
                    <pre id="responseBody" class="text-slate-700 italic">// No telemetry data captured yet.</pre>
                </div>
            </div>

        </div>
    </div>

    <style>
        .style-neon {
            text-shadow: 0 0 8px rgba(239, 68, 68, 0.5);
        }
    </style>

    <script>
        // تعريف القوالب الافتراضية لكل سيناريو هجومي
        const templates = {
            normal: { title: "New Dynamic Jacket", price: 29.99, description: "Clean product text" },
            sqli: { title: "Product' UNION SELECT password FROM users--", price: 0.0, description: "SQLi testing" },
            xss: { title: "<script>alert('Hacked by Virex')<\/script>", price: 0.0, description: "XSS testing" }
        };

        // دالة تحديث الصندوق تلقائياً بناءً على اختيارك
        function updatePayloadTemplate() {
            const type = document.getElementById('attackType').value;
            const textarea = document.getElementById('jsonPayload');
            const btn = document.getElementById('launchBtn');
            
            textarea.value = JSON.stringify(templates[type], null, 2);

            // تغيير لون الزرار ديناميكياً لإعطاء طابع سيبراني هجومي
            if (type === 'normal') {
                btn.className = "w-full font-bold uppercase tracking-wider py-3 rounded-lg text-white transition-all duration-200 bg-emerald-600 hover:bg-emerald-500 shadow-[0_0_15px_rgba(16,185,129,0.3)]";
            } else {
                btn.className = "w-full font-bold uppercase tracking-wider py-3 rounded-lg text-white transition-all duration-200 bg-red-600 hover:bg-red-500 shadow-[0_0_15px_rgba(239,68,68,0.3)]";
            }
        }

        // دالة إرسال الطلب الفعلي للـ WAF (بورت 5000)
        async function launchPayload() {
            const btn = document.getElementById('launchBtn');
            const statusBadge = document.getElementById('statusBadge');
            const responseBox = document.getElementById('responseBody');
            const payloadRaw = document.getElementById('jsonPayload').value;

            // إعدادات واجهة الانتظار
            btn.disabled = true;
            btn.innerText = "Transmitting Payload...";
            statusBadge.className = "text-slate-600 italic text-sm";
            statusBadge.innerText = "Processing...";
            responseBox.className = "text-slate-700 italic";
            responseBox.innerText = "// Waiting for wire data...";

            try {
                // إرسال الـ POST للـ WAF على بورت 5000
                const res = await axios.post('http://localhost:5000/products', JSON.parse(payloadRaw), {
                    headers: { 'Content-Type': 'application/json' }
                });

                // في حالة الـ 200 (الطلب سليم والـ WAF مرره للـ FakeStore)
                statusBadge.className = "inline-block text-xl font-black px-3 py-1 rounded bg-emerald-950 text-emerald-400 border border-emerald-500/30 shadow-[0_0_10px_rgba(16,185,129,0.2)]";
                statusBadge.innerText = `${res.status} Passed to Store`;
                responseBox.className = "text-slate-300";
                responseBox.innerText = JSON.stringify(res.data, null, 2);

            } catch (error) {
                // في حالة الـ 400 (الـ WAF لقط الهجوم وحظره قبل ما يسافر بره)
                if (error.response) {
                    const status = error.response.status;
                    statusBadge.className = "inline-block text-xl font-black px-3 py-1 rounded bg-red-950 text-red-400 border border-red-500/30 shadow-[0_0_10px_rgba(239,68,68,0.2)]";
                    statusBadge.innerText = `${status} ${status === 400 ? 'Blocked by Virex' : 'Error'}`;
                    responseBox.className = "text-red-400 font-bold";
                    responseBox.innerText = JSON.stringify(error.response.data, null, 2);
                } else {
                    // السيرفر مش شغال أساساً
                    statusBadge.className = "inline-block text-xl font-black px-3 py-1 rounded bg-slate-800 text-slate-400";
                    statusBadge.innerText = "OFFLINE";
                    responseBox.className = "text-slate-500";
                    responseBox.innerText = "Connection Refused. Is run_api.py running on Port 5000?";
                }
            } finally {
                btn.disabled = false;
                btn.innerText = "🚀 Launch Payload";
            }
        }

        // تشغيل التمبليت الأول تلقائياً عند فتح الصفحة لأول مرة
        updatePayloadTemplate();
    </script>
</body>
</html>
